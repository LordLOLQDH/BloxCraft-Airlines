name: Validate project files
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse XML files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = sorted(Path(".").rglob("*.xml"))
          for path in files:
              print(f"Checking {path}")
              ET.parse(path)
          print(f"Parsed {len(files)} XML files successfully.")
          PY
      - name: Check required project files
        run: |
          test -f BloxCraft-Airlines-set.xml
          test -f BC-001.xml
          test -f Engines/BC001-Turbojet.xml
          test -f Models/bloxcraft.ac
          test -f Models/bloxcraft.xml
          test -f Nasal/bloxcraft.nas
          test -f Sounds/bloxcraft-sound.xml
          test -f index.html
